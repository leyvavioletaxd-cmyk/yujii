<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Captura de Datos</title>
</head>
<body>

  <h2>Captura de Datos</h2>

  <form id="formulario" action="https://script.google.com/macros/s/AKfycbzcNE8Xjv6IWUOHivtOH-fI8EzS4PgkyFbRd3rmnGcwGW44DrM-KuRkWrtfpOFaLQSTlQ/exec" method="POST" target="hidden_iframe" onsubmit="enviado()">
    <label for="nombre">Nombre:</label><br>
    <input type="text" id="nombre" name="nombre" required><br><br>

    <label for="edad">Edad:</label><br>
    <input type="number" id="edad" name="edad" required min="1" max="120"><br><br>

     <label for="curp">curp:</label><br>
    <input type="text" id="curp" name="curp" required min="1" max="120"><br><br>

<label for="estudios">estudios:</label><br>
    <input type="text" id="estudios" name="estudios" required min="1" max="120"><br><br>

    <label for="direccion">direccion:</label><br>
    
    <input type="text" id="direccion" name="direccion" required min="1" max="120"><br><br>

    <label for="puesto">puesto:</label><br>
    <input type="text" id="puesto" name="puesto" required min="1" max="120"><br><br>

    <label for="empleo">empleo:</label><br>
    <input type="text" id="empleo" name="empleo" required min="1" max="120"><br><br>

    <button type="submit" id="btnEnviar">Enviar</button>
  </form>

  <p id="estado"></p>

  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

  <script>
    function enviado() {
      document.getElementById('btnEnviar').disabled = true;
      document.getElementById('estado').textContent = 'Guardando...';
      
      setTimeout(function() {
        document.getElementById('estado').textContent = '¡Registro guardado con éxito!';
        document.getElementById('formulario').reset();
        document.getElementById('btnEnviar').disabled = false;
      }, 1500);
    }
  </script>

</body>
</html>
